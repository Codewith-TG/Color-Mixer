<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Color Mixer</title>

<style>
    :root {
        --glow: #0033ff;
    }

    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: Arial, sans-serif;
    }

    body {
        background: #020611;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        color: white;
    }

    header {
        text-align: center;
        font-size: 36px;
        font-weight: 700;
        padding: 25px 0;
        background: linear-gradient(90deg, #00eaff, #0077ff);
        -webkit-background-clip: text;
        color: transparent;
    }

    .container {
        width: 92%;
        max-width: 520px;
        margin: auto;
        flex: 1;
        padding: 20px;
        background: #0b1220;
        border-radius: 20px;
        box-shadow: 
            0 0 20px var(--glow),
            0 0 55px var(--glow);
        transition: box-shadow 0.3s ease-in-out;
        margin-bottom: 30px;
    }

    label {
        display: flex;
        justify-content: space-between;
        margin-top: 25px;
        font-size: 18px;
    }

    input[type="range"] {
        width: 100%;
        margin-top: 5px;
        height: 6px;
        appearance: none;
        background: #111;
        border-radius: 6px;
        outline: none;
        position: relative;
    }

    input[type="range"]::before {
        content: "";
        position: absolute;
        height: 6px;
        left: 0;
        top: 0;
        border-radius: 6px;
        width: var(--fill, 0%);
        background: var(--fillColor);
    }

    input[type="range"]::-webkit-slider-thumb {
        appearance: none;
        width: 24px;
        height: 24px;
        border-radius: 50%;
        background: var(--thumbColor);
        border: 3px solid white;
        cursor: pointer;
        box-shadow: 0 0 12px var(--thumbColor);
    }

    #preview {
        width: 100%;
        height: 180px;
        margin-top: 30px;
        border-radius: 20px;
        background: #000;
        box-shadow:
            0 0 25px var(--glow),
            0 0 50px var(--glow);
        transition: box-shadow 0.3s ease-in-out;
    }

    .code-row {
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 12px;
        margin-top: 15px;
        font-size: 22px;
    }

    .copy-btn {
        background: #0077ff;
        border: none;
        padding: 6px 14px;
        font-size: 14px;
        border-radius: 6px;
        cursor: pointer;
        color: white;
        transition: 0.2s;
    }

    .copy-btn:hover {
        opacity: 0.85;
    }

    .copy-btn:active {
        transform: scale(0.92);
    }

    /* Tooltip */
    .copy-btn.copied::after {
        content: "Copied!";
        position: absolute;
        margin-left: 5px;
        font-size: 12px;
        color: #00ff84;
        animation: fadeOut 1.5s forwards;
    }

    @keyframes fadeOut {
        0% { opacity: 1; }
        100% { opacity: 0; }
    }

    footer {
        text-align: center;
        padding: 18px 0;
        margin-top: auto;
        background: linear-gradient(90deg, #00eaff, #00aaff, #0077ff);
        -webkit-background-clip: text;
        color: transparent;
        font-weight: bold;
        font-size: 18px;
        line-height: 26px;
    }
</style>
</head>

<body>

<header>Color Mixer</header>

<div class="container">

    <label>Red <span id="redPercent">0%</span></label>
    <input type="range" id="red" min="0" max="255" value="0" oninput="updateColor()">

    <label>Green <span id="greenPercent">0%</span></label>
    <input type="range" id="green" min="0" max="255" value="0" oninput="updateColor()">

    <label>Blue <span id="bluePercent">0%</span></label>
    <input type="range" id="blue" min="0" max="255" value="0" oninput="updateColor()">

    <div id="preview"></div>

    <div class="code-row">
        <span id="hexValue">#000000</span>
        <button class="copy-btn" onclick="copyCode('hexValue', this)">Copy HEX</button>
    </div>

    <div class="code-row">
        <span id="rgbValue">0, 0, 0</span>
        <button class="copy-btn" onclick="copyCode('rgbValue', this)">Copy RGB</button>
    </div>

</div>

<footer>
    Developed by TG Farmaan
</footer>

<script>
function updateColor() {
    let r = red.value;
    let g = green.value;
    let b = blue.value;

    redPercent.textContent = Math.round((r / 255) * 100) + "%";
    greenPercent.textContent = Math.round((g / 255) * 100) + "%";
    bluePercent.textContent = Math.round((b / 255) * 100) + "%";

    let rgb = `rgb(${r}, ${g}, ${b})`;

    let hex =
        "#" +
        Number(r).toString(16).padStart(2, '0') +
        Number(g).toString(16).padStart(2, '0') +
        Number(b).toString(16).padStart(2, '0');

    preview.style.background = rgb;
    document.documentElement.style.setProperty("--glow", rgb);

    hexValue.innerText = hex.toUpperCase();
    rgbValue.innerText = `${r}, ${g}, ${b}`;

    red.style.setProperty("--thumbColor", "red");
    red.style.setProperty("--fillColor", "red");
    red.style.setProperty("--fill", (r / 255 * 100) + "%");

    green.style.setProperty("--thumbColor", "lime");
    green.style.setProperty("--fillColor", "lime");
    green.style.setProperty("--fill", (g / 255 * 100) + "%");

    blue.style.setProperty("--thumbColor", "#00aaff");
    blue.style.setProperty("--fillColor", "#00aaff");
    blue.style.setProperty("--fill", (b / 255 * 100) + "%");
}

function copyCode(id, btn) {
    let text = document.getElementById(id).innerText;
    navigator.clipboard.writeText(text);

    btn.classList.add("copied");
    setTimeout(() => {
        btn.classList.remove("copied");
    }, 1500);
}
</script>

</body>
</html>
