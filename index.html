<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Advanced RGB Color Mixer with Live Preview">
    <title>Color Mixer</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #020611;
            font-family: Arial, sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            color: #fff;
        }

        header {
            text-align: center;
            padding: 22px 0;
            font-size: 34px;
            background: linear-gradient(90deg, #00eaff, #008cff, #0066ff);
            -webkit-background-clip: text;
            color: transparent;
            font-weight: bold;
        }

        /* ⭐ Wide Mixer Box (Original Style Back) */
        .mixer-box {
            width: 92%;
            margin: 20px auto;
            padding: 22px;
            border-radius: 22px;
            background: #0b1220;
            box-shadow: 0 0 20px #0044ff;
        }

        label {
            font-size: 18px;
            display: block;
            margin-top: 18px;
        }

        input[type="range"] {
            width: 100%;
            margin-top: 5px;
        }

        #preview {
            width: 100%;
            height: 160px;
            margin-top: 25px;
            border-radius: 18px;
            background: #000;
            box-shadow: 0 0 20px #0044ff;
        }

        .value {
            text-align: center;
            margin-top: 15px;
            font-size: 22px;
        }

        /* Footer Always Bottom */
        footer {
            text-align: center;
            padding: 15px 0;
            margin-top: auto;
            background: linear-gradient(90deg, #00eaff, #008cff, #0066ff);
            -webkit-background-clip: text;
            color: transparent;
            font-weight: bold;
            font-size: 18px;
        }
    </style>
</head>
<body>

<header>Color Mixer</header>

<div class="mixer-box">
    <label>Red</label>
    <input type="range" id="red" min="0" max="255" value="0">

    <label>Green</label>
    <input type="range" id="green" min="0" max="255" value="0">

    <label>Blue</label>
    <input type="range" id="blue" min="0" max="255" value="0">

    <div id="preview"></div>

    <div class="value" id="hexValue">#000000</div>
    <div class="value" id="rgbValue">0, 0, 0</div>
</div>

<footer>Color Mixer • © 2025 Tg Farmaan</footer>

<script>
    const red = document.getElementById("red");
    const green = document.getElementById("green");
    const blue = document.getElementById("blue");

    function updateColor() {
        let r = red.value;
        let g = green.value;
        let b = blue.value;

        let rgb = `rgb(${r}, ${g}, ${b})`;
        let hex =
            "#" +
            Number(r).toString(16).padStart(2, '0') +
            Number(g).toString(16).padStart(2, '0') +
            Number(b).toString(16).padStart(2, '0');

        document.getElementById("preview").style.background = rgb;
        document.getElementById("hexValue").innerText = hex.toUpperCase();
        document.getElementById("rgbValue").innerText = `${r}, ${g}, ${b}`;
    }

    red.addEventListener("input", updateColor);
    green.addEventListener("input", updateColor);
    blue.addEventListener("input", updateColor);
</script>

</body>
</html>
